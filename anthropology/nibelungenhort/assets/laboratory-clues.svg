<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img"><title>One object, several clocks</title><rect width="1000" height="600" fill="#102936"/><text x="45" y="65" font-family="Segoe UI,Arial,sans-serif" font-size="34" fill="#edc779"><tspan x="45" dy="0">One object, several clocks</tspan></text><text x="45" y="103" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#a9c3cb"><tspan x="45" dy="0">Rülzheim folding-chair research · CEZA annual report 2018, pp. 43–44.</tspan></text><rect x="45" y="165" width="910" height="100" rx="10" fill="#1c454b"/><rect x="45" y="283" width="910" height="100" rx="10" fill="#263f4d"/><rect x="45" y="401" width="910" height="110" rx="10" fill="#433e33"/><text x="65" y="208" font-family="Segoe UI,Arial,sans-serif" font-size="26" fill="#87d7c2"><tspan x="65" dy="0">Organic sample</tspan></text><text x="65" y="244" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#d9e9ec"><tspan x="65" dy="0">Radiocarbon</tspan></text><text x="360" y="205" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#d9e9ec"><tspan x="360" dy="0">A date for associated organic material.</tspan><tspan x="360" dy="30.799999999999997">Not a direct date for concealment of the hoard.</tspan></text><text x="65" y="324" font-family="Segoe UI,Arial,sans-serif" font-size="26" fill="#87d7c2"><tspan x="65" dy="0">Solder and silver</tspan></text><text x="65" y="359" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#d9e9ec"><tspan x="65" dy="0">Composition and isotopes</tspan></text><text x="360" y="324" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#d9e9ec"><tspan x="360" dy="0">Clues about materials, manufacture or repair.</tspan><tspan x="360" dy="30.799999999999997">Not a name for an ancient owner.</tspan></text><text x="65" y="444" font-family="Segoe UI,Arial,sans-serif" font-size="26" fill="#edc779"><tspan x="65" dy="0">Deposit context</tspan></text><text x="65" y="479" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#d9e9ec"><tspan x="65" dy="0">Position and associations</tspan></text><text x="360" y="442" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#d9e9ec"><tspan x="360" dy="0">Recovery context is needed to test how and why</tspan><tspan x="360" dy="30.799999999999997">the objects were brought together and buried.</tspan></text><text x="45" y="570" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#a9c3cb"><tspan x="45" dy="0">NIBELUNGEN ATLAS  /  Explanatory illustration · not a field reconstruction</tspan></text></svg>