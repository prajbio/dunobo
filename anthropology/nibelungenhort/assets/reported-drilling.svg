<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img"><title>The reported ten-metre observation</title><rect width="1000" height="600" fill="#102936"/><text x="45" y="65" font-family="Segoe UI,Arial,sans-serif" font-size="34" fill="#edc779"><tspan x="45" dy="0">The reported ten-metre observation</tspan></text><text x="45" y="103" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#a9c3cb"><tspan x="45" dy="0">The sample, original coordinates and drilling log have not been inspected.</tspan></text><rect x="45" y="155" width="530" height="85" rx="10" fill="#76664a"/><rect x="45" y="240" width="530" height="110" rx="10" fill="#594e3f"/><rect x="45" y="350" width="530" height="160" rx="10" fill="#393d38"/><path d="M65 158L552 158" fill="none" stroke="#87d7c2" stroke-width="4" stroke-dasharray=""/><path d="M295 160L295 450" fill="none" stroke="#cbb0f2" stroke-width="4" stroke-dasharray="9 9"/><rect x="256" y="431" width="78" height="43" rx="10" fill="#b4aba0"/><text x="286" y="464" font-family="Segoe UI,Arial,sans-serif" font-size="31" fill="#102936"><tspan x="286" dy="0">?</tspan></text><text x="65" y="197" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#d9e9ec"><tspan x="65" dy="0">Surface</tspan></text><text x="65" y="293" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#d9e9ec"><tspan x="65" dy="0">Sediment shown</tspan><tspan x="65" dy="28">schematically only</tspan></text><text x="357" y="453" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#d9e9ec"><tspan x="357" dy="0">Reported stone</tspan><tspan x="357" dy="26.599999999999998">about 10 m deep</tspan></text><path d="M580 447L623 447" fill="none" stroke="#edc779" stroke-width="4" stroke-dasharray=""/><text x="640" y="200" font-family="Segoe UI,Arial,sans-serif" font-size="27" fill="#edc779"><tspan x="640" dy="0">Observation to verify</tspan></text><text x="640" y="253" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#d9e9ec"><tspan x="640" dy="0">Was it marble?</tspan><tspan x="640" dy="29.4">Was the depth recorded?</tspan><tspan x="640" dy="29.4">Where is the sample?</tspan><tspan x="640" dy="29.4">Was it in its original place?</tspan></text><text x="640" y="412" font-family="Segoe UI,Arial,sans-serif" font-size="27" fill="#edc779"><tspan x="640" dy="0">Interpretation to test</tspan></text><text x="640" y="455" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#d9e9ec"><tspan x="640" dy="0">A stone is not evidence</tspan><tspan x="640" dy="29.4">of a treasure underneath.</tspan></text><text x="45" y="570" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#a9c3cb"><tspan x="45" dy="0">NIBELUNGEN ATLAS  /  Explanatory illustration · not a field reconstruction</tspan></text></svg>