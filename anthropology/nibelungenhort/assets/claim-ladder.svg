<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img"><title>Three discoveries. Three different conclusions.</title><rect width="1000" height="600" fill="#102936"/><text x="45" y="65" font-family="Segoe UI,Arial,sans-serif" font-size="34" fill="#edc779"><tspan x="45" dy="0">Three discoveries. Three different conclusions.</tspan></text><text x="45" y="103" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#a9c3cb"><tspan x="45" dy="0">Ask which claim a piece of evidence can actually establish.</tspan></text><rect x="45" y="160" width="290" height="335" rx="10" fill="#1a4449"/><text x="70" y="207" font-family="Segoe UI,Arial,sans-serif" font-size="33" fill="#edc779"><tspan x="70" dy="0">01</tspan></text><rect x="365" y="160" width="290" height="335" rx="10" fill="#28404b"/><text x="390" y="207" font-family="Segoe UI,Arial,sans-serif" font-size="33" fill="#edc779"><tspan x="390" dy="0">02</tspan></text><rect x="685" y="160" width="290" height="335" rx="10" fill="#403d34"/><text x="710" y="207" font-family="Segoe UI,Arial,sans-serif" font-size="33" fill="#edc779"><tspan x="710" dy="0">03</tspan></text><text x="70" y="265" font-family="Segoe UI,Arial,sans-serif" font-size="29" fill="#d9e9ec"><tspan x="70" dy="0">An ancient</tspan><tspan x="70" dy="40.599999999999994">deposit</tspan></text><text x="70" y="363" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#d9e9ec"><tspan x="70" dy="0">Objects, stratigraphy,</tspan><tspan x="70" dy="28">dating and associations.</tspan><tspan x="70" dy="28">A real archaeological</tspan><tspan x="70" dy="28">discovery.</tspan></text><text x="390" y="265" font-family="Segoe UI,Arial,sans-serif" font-size="29" fill="#d9e9ec"><tspan x="390" dy="0">A late antique</tspan><tspan x="390" dy="40.599999999999994">regional hoard</tspan></text><text x="390" y="363" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#d9e9ec"><tspan x="390" dy="0">A supported period</tspan><tspan x="390" dy="28">and geographical context.</tspan><tspan x="390" dy="28">Still no particular</tspan><tspan x="390" dy="28">owner established.</tspan></text><text x="710" y="265" font-family="Segoe UI,Arial,sans-serif" font-size="29" fill="#d9e9ec"><tspan x="710" dy="0">The legendary</tspan><tspan x="710" dy="40.599999999999994">Nibelungen hoard</tspan></text><text x="710" y="363" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#d9e9ec"><tspan x="710" dy="0">Requires independent</tspan><tspan x="710" dy="28">evidence connecting it</tspan><tspan x="710" dy="28">to the historical claim.</tspan><tspan x="710" dy="28">This remains unproven.</tspan></text><text x="45" y="570" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#a9c3cb"><tspan x="45" dy="0">NIBELUNGEN ATLAS  /  Explanatory illustration · not a field reconstruction</tspan></text></svg>