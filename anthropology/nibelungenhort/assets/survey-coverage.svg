<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img"><title>What does an empty search rule out?</title><rect width="1000" height="600" fill="#102936"/><text x="45" y="65" font-family="Segoe UI,Arial,sans-serif" font-size="34" fill="#edc779"><tspan x="45" dy="0">What does an empty search rule out?</tspan></text><text x="45" y="103" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#a9c3cb"><tspan x="45" dy="0">Illustrative grid only. No measured coverage for a Nibelungen campaign.</tspan></text><rect x="45" y="155" width="47" height="47" rx="10" fill="#87d7c2"/><rect x="103" y="155" width="47" height="47" rx="10" fill="#87d7c2"/><rect x="161" y="155" width="47" height="47" rx="10" fill="#87d7c2"/><rect x="219" y="155" width="47" height="47" rx="10" fill="#87d7c2"/><rect x="277" y="155" width="47" height="47" rx="10" fill="#87d7c2"/><rect x="335" y="155" width="47" height="47" rx="10" fill="#87d7c2"/><rect x="393" y="155" width="47" height="47" rx="10" fill="#87d7c2"/><rect x="451" y="155" width="47" height="47" rx="10" fill="#87d7c2"/><rect x="45" y="213" width="47" height="47" rx="10" fill="#87d7c2"/><rect x="103" y="213" width="47" height="47" rx="10" fill="#87d7c2"/><rect x="161" y="213" width="47" height="47" rx="10" fill="#87d7c2"/><rect x="219" y="213" width="47" height="47" rx="10" fill="#87d7c2"/><rect x="277" y="213" width="47" height="47" rx="10" fill="#446876"/><rect x="335" y="213" width="47" height="47" rx="10" fill="#446876"/><rect x="393" y="213" width="47" height="47" rx="10" fill="#446876"/><rect x="451" y="213" width="47" height="47" rx="10" fill="#446876"/><rect x="45" y="271" width="47" height="47" rx="10" fill="#446876"/><rect x="103" y="271" width="47" height="47" rx="10" fill="#446876"/><rect x="161" y="271" width="47" height="47" rx="10" fill="#446876"/><rect x="219" y="271" width="47" height="47" rx="10" fill="#446876"/><rect x="277" y="271" width="47" height="47" rx="10" fill="#213e4b"/><rect x="335" y="271" width="47" height="47" rx="10" fill="#213e4b"/><rect x="393" y="271" width="47" height="47" rx="10" fill="#213e4b"/><rect x="451" y="271" width="47" height="47" rx="10" fill="#213e4b"/><rect x="45" y="329" width="47" height="47" rx="10" fill="#213e4b"/><rect x="103" y="329" width="47" height="47" rx="10" fill="#213e4b"/><rect x="161" y="329" width="47" height="47" rx="10" fill="#213e4b"/><rect x="219" y="329" width="47" height="47" rx="10" fill="#213e4b"/><rect x="277" y="329" width="47" height="47" rx="10" fill="#213e4b"/><rect x="335" y="329" width="47" height="47" rx="10" fill="#213e4b"/><rect x="393" y="329" width="47" height="47" rx="10" fill="#213e4b"/><rect x="451" y="329" width="47" height="47" rx="10" fill="#213e4b"/><rect x="45" y="387" width="47" height="47" rx="10" fill="#213e4b"/><rect x="103" y="387" width="47" height="47" rx="10" fill="#213e4b"/><rect x="161" y="387" width="47" height="47" rx="10" fill="#213e4b"/><rect x="219" y="387" width="47" height="47" rx="10" fill="#213e4b"/><rect x="277" y="387" width="47" height="47" rx="10" fill="#213e4b"/><rect x="335" y="387" width="47" height="47" rx="10" fill="#213e4b"/><rect x="393" y="387" width="47" height="47" rx="10" fill="#213e4b"/><rect x="451" y="387" width="47" height="47" rx="10" fill="#213e4b"/><text x="555" y="182" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#edc779"><tspan x="555" dy="0">Define the target first</tspan></text><text x="555" y="227" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#d9e9ec"><tspan x="555" dy="0">A chest, scattered coins and a wall</tspan><tspan x="555" dy="30.799999999999997">are different detection problems.</tspan></text><rect x="555" y="287" width="24" height="24" rx="10" fill="#87d7c2"/><text x="596" y="309" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#d9e9ec"><tspan x="596" dy="0">Searched with useful sensitivity</tspan></text><rect x="555" y="335" width="24" height="24" rx="10" fill="#446876"/><text x="596" y="357" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#d9e9ec"><tspan x="596" dy="0">Observed, but detection uncertain</tspan></text><rect x="555" y="383" width="24" height="24" rx="10" fill="#213e4b"/><text x="596" y="405" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#d9e9ec"><tspan x="596" dy="0">Outside the effective search</tspan></text><text x="45" y="506" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#edc779"><tspan x="45" dy="0">A negative result applies only to a defined target, volume and detection standard.</tspan></text><text x="45" y="570" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#a9c3cb"><tspan x="45" dy="0">NIBELUNGEN ATLAS  /  Explanatory illustration · not a field reconstruction</tspan></text></svg>