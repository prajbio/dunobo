<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img"><title>Reading the Lochheim sediment sequence</title><rect width="1000" height="600" fill="#102936"/><text x="45" y="65" font-family="Segoe UI,Arial,sans-serif" font-size="34" fill="#edc779"><tspan x="45" dy="0">Reading the Lochheim sediment sequence</tspan></text><text x="45" y="103" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#a9c3cb"><tspan x="45" dy="0">Simplified from Hildebrandt &amp; Gross, 2002, pp. 39–41. Not to scale.</tspan></text><rect x="45" y="154" width="400" height="55" rx="10" fill="#5c5947"/><rect x="45" y="209" width="400" height="105" rx="10" fill="#b29964"/><rect x="45" y="314" width="400" height="80" rx="10" fill="#343831"/><rect x="45" y="394" width="400" height="113" rx="10" fill="#9b8558"/><text x="64" y="190" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#d9e9ec"><tspan x="64" dy="0">Topsoil</tspan></text><text x="64" y="262" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#172831"><tspan x="64" dy="0">Yellow redeposited loess</tspan><tspan x="64" dy="28">Mean thickness about 60 cm</tspan></text><text x="64" y="345" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#d9e9ec"><tspan x="64" dy="0">Dark organic mud</tspan><tspan x="64" dy="28">About 20–40 cm</tspan></text><text x="64" y="440" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#172831"><tspan x="64" dy="0">Older redeposited loess</tspan><tspan x="64" dy="28">More than 40 cm</tspan></text><text x="505" y="187" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#edc779"><tspan x="505" dy="0">What the layers can tell us</tspan></text><text x="505" y="241" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#d9e9ec"><tspan x="505" dy="0">Different depositional conditions.</tspan><tspan x="505" dy="32.199999999999996">Associated finds constrain timing.</tspan><tspan x="505" dy="32.199999999999996">The report proposes a medieval</tspan><tspan x="505" dy="32.199999999999996">change in the local water system.</tspan></text><text x="505" y="396" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#edc779"><tspan x="505" dy="0">What they do not show</tspan></text><text x="505" y="447" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#d9e9ec"><tspan x="505" dy="0">No treasure-bearing layer is identified.</tspan><tspan x="505" dy="29.4">Do not transfer this profile to Hamm.</tspan></text><text x="45" y="570" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#a9c3cb"><tspan x="45" dy="0">NIBELUNGEN ATLAS  /  Explanatory illustration · not a field reconstruction</tspan></text></svg>